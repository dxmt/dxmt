// The gRPC surface of DXMT VectorDB.
//
// It carries the data path -- search and insert -- and the table lifecycle around it. Not the
// whole HTTP API: hybrid search, full-text search, DXQL, snapshots and backups stay on REST,
// where an extra millisecond of JSON does not matter and a schema would only have to be kept in
// step for no gain.
//
// Why it exists at all: a search request is a vector, and a vector is where JSON is worst.
// A 768-dimension float array is about 9 KB of text to write and parse; the same array is 3,072
// bytes here, packed, with no parsing beyond a memcpy. Measured on this database, a Python
// client driving REST spends about 70 times more CPU per query than the server does, and the
// same table answers 6,465 queries a second through it against 8,822 through a client that does
// not pay that.
//
// Payloads are carried as a JSON string rather than google.protobuf.Struct. The REST API already
// hands them out as `payload_json`, payloads are free-form by design, and Struct would add a
// well-known-types dependency to every generated client to re-encode something the server stores
// as text anyway.

syntax = "proto3";

package dxmt.v1;

service VectorDB {
  // Whether the server is up and its local durability is healthy -- the same question
  // `GET /ready` answers, and the same answer: not ready once a WAL write has failed.
  rpc Health(HealthRequest) returns (HealthResponse);

  rpc CreateTable(CreateTableRequest) returns (TableInfo);
  rpc ListTables(ListTablesRequest) returns (ListTablesResponse);
  rpc GetTable(GetTableRequest) returns (TableInfo);
  rpc DeleteTable(DeleteTableRequest) returns (DeleteTableResponse);

  // Insert or replace. An id that is already there is overwritten.
  rpc Insert(InsertRequest) returns (InsertResponse);
  rpc Get(GetRequest) returns (Record);
  rpc Update(UpdateRequest) returns (UpdateResponse);
  // Reports how many records were actually removed, which is not the number asked for when
  // some of the ids were not there.
  rpc Delete(DeleteRequest) returns (DeleteResponse);

  rpc Search(SearchRequest) returns (SearchResponse);
}

message HealthRequest {}

message HealthResponse {
  bool ready = 1;
  string version = 2;
}

// How a table measures distance. Named rather than free text so a typo is a compile error in
// the caller instead of a 400 from the server.
enum DistanceMetric {
  DISTANCE_METRIC_UNSPECIFIED = 0;  // the server's default, cosine
  DISTANCE_METRIC_COSINE = 1;
  DISTANCE_METRIC_EUCLIDEAN = 2;
  DISTANCE_METRIC_DOT_PRODUCT = 3;
}

message CreateTableRequest {
  string name = 1;
  uint32 dimension = 2;
  DistanceMetric distance_metric = 3;
  string description = 4;
}

message TableInfo {
  string name = 1;
  uint32 dimension = 2;
  uint64 record_count = 3;
  string index_type = 4;
}

message ListTablesRequest {}

message ListTablesResponse {
  repeated TableInfo tables = 1;
}

message GetTableRequest {
  string name = 1;
}

message DeleteTableRequest {
  string name = 1;
}

message DeleteTableResponse {}

// A record. `vector` is packed by proto3 for repeated scalars, which is the whole point of
// this interface: 3,072 bytes for 768 dimensions rather than about 9 KB of decimal text.
message Record {
  string id = 1;
  repeated float vector = 2;
  // Free-form JSON, as a string. Empty means no payload.
  string payload_json = 3;
  uint64 version = 4;
}

message InsertRequest {
  string table = 1;
  repeated Record records = 2;
}

message InsertResponse {
  uint32 count = 1;
  repeated string inserted_ids = 2;
}

message GetRequest {
  string table = 1;
  string id = 2;
}

message UpdateRequest {
  string table = 1;
  string id = 2;
  // Absent leaves the stored dense, sparse and named vectors alone, which is what makes a
  // payload-only update safe on a table used for hybrid search.
  repeated float vector = 3;
  // Absent leaves the payload alone. Present replaces it, or merges into it when `merge` is
  // set.
  optional string payload_json = 4;
  bool merge = 5;
  // Create the record when it is not there. Off by default, like REST.
  bool upsert = 6;
}

message UpdateResponse {
  uint64 version = 1;
}

message DeleteRequest {
  string table = 1;
  repeated string ids = 2;
}

message DeleteResponse {
  uint32 deleted = 1;
  uint32 requested = 2;
}

// One payload comparison. The oneof is what keeps a filter honest: the REST shape is
// `{"type": "Equal", "value": ...}` with the type as a string, so a misspelt operator is a
// runtime error; here it cannot be spelt at all.
message Condition {
  string key = 1;
  oneof operation {
    string equal = 2;
    string not_equal = 3;
    double greater_than = 4;
    double greater_than_or_equal = 5;
    double less_than = 6;
    double less_than_or_equal = 7;
    StringList in = 8;
    StringList not_in = 9;
    string contains = 10;
    string starts_with = 11;
    string ends_with = 12;
    bool equal_bool = 13;
    double equal_number = 14;
  }
}

message StringList {
  repeated string values = 1;
}

// Always must / must_not / should, never a bare condition: the server's filter has exactly
// these three lists, and a condition sent outside them matches everything rather than failing.
message Filter {
  repeated Condition must = 1;
  repeated Condition must_not = 2;
  repeated Condition should = 3;
}

message SearchRequest {
  string table = 1;
  repeated float vector = 2;
  uint32 top_k = 3;
  Filter filter = 4;
  bool with_payload = 5;
  bool with_vector = 6;
}

message SearchHit {
  string id = 1;
  float score = 2;
  string payload_json = 3;
  repeated float vector = 4;
}

message SearchResponse {
  repeated SearchHit hits = 1;
  uint32 total = 2;
  uint64 took_ms = 3;
}
