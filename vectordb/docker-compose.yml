services:
  vectordb:
    build:
      context: .
      target: runtime
    image: dxmt/vectordb:alpha
    restart: unless-stopped
    ports:
      - "9999:9999"
    environment:
      DB_WAL_DIR: /data/wal
      DB_SNAPSHOT_INTERVAL_SECS: "300"
      DB_EVICTION_INTERVAL_SECS: "600"
      RUST_LOG: info
    volumes:
      - dxmt-vectordb-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9999/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s

volumes:
  dxmt-vectordb-data:
