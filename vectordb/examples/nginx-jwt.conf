# NGINX Configuration for DXMT VectorDB with JWT Authentication
# Place this in /etc/nginx/sites-available/vectordb

upstream vectordb_backend {
    server 127.0.0.1:9999;
    # Add more nodes for load balancing
    # server 127.0.0.1:9998;
    # server 127.0.0.1:9997;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=search_limit:10m rate=50r/m;

server {
    listen 80;
    server_name vectordb.example.com;
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name vectordb.example.com;
    
    # SSL Configuration
    ssl_certificate /etc/ssl/certs/vectordb.crt;
    ssl_certificate_key /etc/ssl/private/vectordb.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # Security Headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";
    
    # CORS Headers for API access
    add_header Access-Control-Allow-Origin "$http_origin" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-API-Key" always;
    add_header Access-Control-Allow-Credentials true always;
    
    # Handle preflight requests
    if ($request_method = 'OPTIONS') {
        return 204;
    }
    
    # Health check endpoint (no auth required)
    location /health {
        proxy_pass http://vectordb_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Public API reference (no auth required). `^~` so the /api/ regex below does not take it.
    location ^~ /api/docs {
        proxy_pass http://vectordb_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # API endpoints with JWT authentication. A prefix location, not a regex: nginx takes the
    # first regex that matches, so a `~ ^/api/` here would shadow the stricter search and
    # admin rules below. Regex locations win over a matching prefix, which is what we want.
    location /api/ {
        # Rate limiting
        limit_req zone=api_limit burst=20 nodelay;
        
        # JWT Authentication using auth_jwt module
        # Requires nginx-plus or compile with --with-http_auth_jwt_module
        auth_jwt "VectorDB API";
        auth_jwt_key_file /etc/nginx/jwt.key;
        
        # Alternative: Use lua-resty-jwt for open source nginx
        # access_by_lua_block {
        #     local jwt = require "resty.jwt"
        #     local jwt_token = ngx.var.http_authorization
        #     if not jwt_token then
        #         ngx.status = 401
        #         ngx.say("Missing Authorization header")
        #         ngx.exit(401)
        #     end
        #     
        #     jwt_token = string.gsub(jwt_token, "Bearer ", "")
        #     local jwt_obj = jwt:verify("your-secret-key", jwt_token)
        #     if not jwt_obj.valid then
        #         ngx.status = 401
        #         ngx.say("Invalid JWT token")
        #         ngx.exit(401)
        #     end
        # }
        
        proxy_pass http://vectordb_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-ID $jwt_claim_sub;
        
        # Timeout settings
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Search endpoints with stricter rate limiting
    location ~ ^/api/.*/search {
        limit_req zone=search_limit burst=10 nodelay;
        
        auth_jwt "VectorDB API";
        auth_jwt_key_file /etc/nginx/jwt.key;
        
        proxy_pass http://vectordb_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-ID $jwt_claim_sub;
        
        # Longer timeout for search operations
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
    
    # WebSocket endpoints (if enabled)
    location /ws {
        auth_jwt "VectorDB API";
        auth_jwt_key_file /etc/nginx/jwt.key;
        
        proxy_pass http://vectordb_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-ID $jwt_claim_sub;
        
        # WebSocket timeout settings
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    
    # Snapshots and backups: administrative, so IP-restricted and admin-only
    location ~ ^/api/v1/(snapshot|backup)$ {
        # Restrict to specific IP ranges
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        
        auth_jwt "VectorDB Admin";
        auth_jwt_key_file /etc/nginx/jwt.key;
        
        # Require admin role in JWT
        if ($jwt_claim_role != "admin") {
            return 403;
        }
        
        proxy_pass http://vectordb_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-ID $jwt_claim_sub;
        proxy_set_header X-User-Role $jwt_claim_role;
    }
    
    # Metrics endpoint (Prometheus)
    location /metrics {
        # Restrict to monitoring systems
        allow 10.0.0.0/8;
        deny all;
        
        proxy_pass http://vectordb_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Default location
    location / {
        return 404;
    }
}

# API Key based authentication alternative
server {
    listen 8443 ssl http2;
    server_name api.vectordb.example.com;
    
    ssl_certificate /etc/ssl/certs/vectordb.crt;
    ssl_certificate_key /etc/ssl/private/vectordb.key;
    
    # API Key authentication
    location / {
        # Check for X-API-Key header
        if ($http_x_api_key = "") {
            return 401;
        }
        
        # Validate API key using auth_request
        auth_request /auth;
        
        proxy_pass http://vectordb_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Key $http_x_api_key;
    }
    
    # Internal auth endpoint
    location = /auth {
        internal;
        proxy_pass http://auth_service/validate_api_key;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-API-Key $http_x_api_key;
    }
}
