[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-dxmt"
version = "0.1.0"
description = "LangChain integration for DXMT VectorDB"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "DXMT Team", email = "team@dxmt.online"}
]
keywords = [
    "langchain",
    "vector database",
    "vectordb",
    "dxmt",
    "embeddings",
    "llm",
    "ai",
    "nlp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "langchain-core>=0.3.0,<2.0.0",
    "dxmt-python-sdk>=0.1.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "numpy>=1.24.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "langchain>=1.0.0",
    "langchain-community>=0.4.0",
    "langchain-classic>=1.0.0",
    "langchain-text-splitters>=1.0.0",
    "langchain-openai>=0.2.0",
    "langchain-standard-tests>=0.1.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "langchain>=1.0.0",
    "langchain-community>=0.4.0",
    "langchain-classic>=1.0.0",
    "langchain-text-splitters>=1.0.0",
    "langchain-openai>=0.2.0",  # For integration tests with OpenAI embeddings
    "langchain-standard-tests>=0.1.0",  # LangChain official test suite
]

[project.urls]
Homepage = "https://github.com/dxmt/dxmt"
Documentation = "https://github.com/dxmt/dxmt/tree/main/vectordb/langchain-dxmt"
Repository = "https://github.com/dxmt/dxmt"
"Bug Tracker" = "https://github.com/dxmt/dxmt/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["langchain_dxmt*"]

[tool.setuptools.package-data]
langchain_dxmt = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Coverage is not in the default options: `pytest-cov` is a dev extra, and requiring a plugin
# to run the tests at all means a checkout without it fails at startup rather than running.
# Ask for it explicitly: `pytest --cov=langchain_dxmt --cov-report=term-missing`.
addopts = [
    "--strict-markers",
    "--strict-config",
]
asyncio_mode = "auto"
markers = [
    "integration: needs a running DXMT server (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["langchain_dxmt"]

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
