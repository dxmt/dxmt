[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llama-index-vector-stores-dxmt"
version = "1.6.0"
description = "LlamaIndex vector store for DXMT"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "DXMT Team", email = "contact@dxmt.online" }]
requires-python = ">=3.10,<4.0"
keywords = ["llama-index", "vector-store", "dxmt", "vector-database", "embeddings", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The llama-index-core range follows what the integrations in run-llama/llama_index declare
# for the same core (0.13 <= core < 0.15 at 2026-11); widen it when a new minor is checked.
dependencies = [
    "llama-index-core>=0.13.0,<0.15",
    "dxmt-python-sdk>=1.6.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
examples = [
    "llama-index-embeddings-openai>=0.1.0",
    "llama-index-llms-openai>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/dxmt/dxmt"
Repository = "https://github.com/dxmt/dxmt"
Documentation = "https://github.com/dxmt/dxmt/tree/main/vectordb/clients/llama-index-vector-stores-dxmt"
Issues = "https://github.com/dxmt/dxmt/issues"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

# `llama_index/` is a namespace shared with llama-index-core and every other integration:
# no `__init__.py` above `dxmt/`, or this wheel would shadow theirs.
[tool.hatch.build.targets.sdist]
include = ["llama_index/", "tests/", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
include = ["llama_index/"]

[tool.llamahub]
contains_example = false
import_path = "llama_index.vector_stores.dxmt"

[tool.llamahub.class_authors]
DXMTVectorStore = "dxmt"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["llama_index"]
omit = ["tests/*"]
