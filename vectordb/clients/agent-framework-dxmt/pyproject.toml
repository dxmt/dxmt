[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-framework-dxmt"
version = "1.6.0"
description = "DXMT vector store and memory context provider for Microsoft Agent Framework"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "DXMT Team", email = "contact@dxmt.online" }]
requires-python = ">=3.11"
keywords = ["agent-framework", "microsoft-agent-framework", "dxmt", "vector-store", "agent-memory", "context-provider"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# BaseVectorStore / BaseVectorSearch and ContextProvider.before_run/after_run are the 1.19+ shapes.
dependencies = [
    "agent-framework-core>=1.19.0,<2",
    "dxmt-python-sdk>=1.6.0,<2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/dxmt/dxmt"
Source = "https://github.com/dxmt/dxmt/tree/main/vectordb/clients/agent-framework-dxmt"
Issues = "https://github.com/dxmt/dxmt/issues"

[tool.hatch.build.targets.wheel]
packages = ["agent_framework_dxmt"]

[tool.hatch.build.targets.sdist]
include = ["agent_framework_dxmt/", "tests/", "samples/", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs a DXMT server at DXMT_TEST_URL"]

[tool.ruff]
line-length = 120
target-version = "py311"
