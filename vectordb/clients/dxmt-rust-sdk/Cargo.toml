[package]
name = "dxmt-client"
version = "1.3.2"
edition = "2021"
description = "Rust client for DXMT VectorDB"
license = "Apache-2.0"
repository = "https://github.com/dxmt/dxmt"

# Its own package, not part of the server crate, for the same reason the Python and JavaScript
# clients are their own packages: a client's dependencies have no business reaching the server
# binary, and a user embedding one should not compile the other.

[dependencies]
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[example]]
name = "basic_crud"
path = "examples/basic_crud.rs"
