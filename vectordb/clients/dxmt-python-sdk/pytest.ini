[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    integration: Integration tests (require DXMT server)
    slow: Slow tests
    asyncio: Async tests

# Options
addopts =
    -v
    --strict-markers
    --strict-config
    --tb=short

# Async configuration
asyncio_mode = auto
