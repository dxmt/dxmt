# DXMT memory plugin -- default configuration.
#
# This file is the single source of the plugin's defaults. To configure the plugin, copy
# the blocks below into your ~/.hermes/config.yaml and edit there; its values override
# these. Do not edit this file to change your own setup (a plugin update overwrites it).
#
# `hermes memory setup` seeds ~/.hermes/config.yaml from these defaults.

# Activate the plugin (a Hermes-level setting, not under plugins.dxmt):
memory:
  provider: dxmt

plugins:
  dxmt:
    server:
      # Where the DXMT server listens. `DXMT_URL` in the environment overrides this.
      # The server does the embedding (a table-level or server-level model), so no
      # embedding key is needed here.
      url: http://localhost:9999
      # Environment variable holding the server's API key, if it has one.
      api_key_env: DXMT_API_KEY
      timeout: 15

    retrieval:
      top_k: 10            # memories a recall tool call returns by default
      prefetch_k: 5        # memories injected before each turn
      min_score: 0.0       # drop recalled memories scoring below this (cosine similarity, 1.0 = identical)
      # Recall only memories written for this agent workspace. Off, the agent sees every
      # memory on the server, including ones other agents and tools wrote over REST/MCP.
      isolate_workspace: true

    turns:
      enabled: true        # keep conversation turns (kind "turn") as provenance for extracted facts

    extraction:
      enabled: true        # LLM fact extraction at pre-compress and session end
      min_turns: 3         # skip extraction for sessions shorter than this many user turns
