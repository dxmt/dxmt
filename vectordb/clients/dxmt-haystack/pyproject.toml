[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dxmt-haystack"
version = "1.6.0"
description = "DXMT as a Haystack document store, with embedding, BM25 and hybrid retrievers"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "DXMT Team", email = "contact@dxmt.online" }]
requires-python = ">=3.10"
keywords = ["haystack", "document-store", "dxmt", "vector-database", "rag", "embeddings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# haystack-ai 2.x and 3.x share the DocumentStore protocol and Document fields this package uses.
dependencies = [
    "haystack-ai>=2.29.0,<4",
    "dxmt-python-sdk>=1.6.0,<2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[project.urls]
Homepage = "https://github.com/dxmt/dxmt"
Source = "https://github.com/dxmt/dxmt/tree/main/vectordb/clients/dxmt-haystack"
Issues = "https://github.com/dxmt/dxmt/issues"

# `haystack_integrations` is the namespace every Haystack integration shares: no `__init__.py`
# above `dxmt/`, or this wheel would shadow the others installed beside it.
[tool.hatch.build.targets.wheel]
packages = ["src/haystack_integrations"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running DXMT server (DXMT_HOST / DXMT_PORT)"]
