[mypy]
# Global options
python_version = 3.9
# Follow imports only for our code
follow_imports = normal
# Skip checking third-party packages
ignore_missing_imports = False
# Allow returning Any from functions
warn_return_any = False
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
# Allow calling untyped functions
disallow_untyped_calls = False
disallow_untyped_decorators = False
no_implicit_optional = True
warn_redundant_casts = True
# Don't warn about unused ignores
warn_unused_ignores = False
warn_no_return = True
# Don't warn about unreachable code
warn_unreachable = False
strict_equality = True
pretty = True

# Output
show_error_codes = True
show_error_context = True
show_column_numbers = True

# Import discovery
namespace_packages = True
explicit_package_bases = True

# Strictness - Use individual flags for better control
strict = False

# Per-module options
[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False

[mypy-setuptools.*]
ignore_missing_imports = True

[mypy-httpx.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-langchain_core.*]
ignore_missing_imports = True

[mypy-langchain_openai.*]
ignore_missing_imports = True

[mypy-pydantic.*]
ignore_missing_imports = True

[mypy-pytest.*]
ignore_missing_imports = True
follow_imports = skip

[mypy-_pytest.*]
ignore_missing_imports = True
follow_imports = skip
