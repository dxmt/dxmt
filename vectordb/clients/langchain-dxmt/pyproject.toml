[build-system]
# setuptools >= 77 is the first to understand PEP 639's `license` SPDX string and
# `license-files` below.
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-dxmt"
version = "1.6.0"
description = "LangChain integration for DXMT, the open-source memory database for personal agents"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "DXMT Team", email = "contact@dxmt.online"}
]
keywords = [
    "langchain",
    "vector database",
    "vectordb",
    "dxmt",
    "embeddings",
    "llm",
    "ai",
    "nlp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Only what `langchain_dxmt/` imports. `pydantic` and `numpy` were listed here and imported
# by nothing in the package; pydantic arrives with langchain-core anyway.
dependencies = [
    "langchain-core>=1.0.0,<2.0.0",
    # The SDK has been 1.x since 1.0.0; this said <1.0.0 until 1.3.1, so in any environment
    # with the current SDK the adapter could not be installed at all.
    "dxmt-python-sdk>=1.3.0,<2.0.0",
]

[project.optional-dependencies]
# `langchain-tests` is the official conformance suite (`tests/langchain_standard/`). The
# extras used to ask for `langchain-standard-tests`, its old name, which is not on PyPI, so
# `pip install -e ".[dev]"` failed at the first step. `langchain-openai` is not here: only
# `DXMT_TEST_EMBEDDING=openai` and the benchmark script use it, and both import it lazily.
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "langchain-tests>=1.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "langchain-tests>=1.0.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/dxmt/dxmt"
Documentation = "https://github.com/dxmt/dxmt/tree/main/vectordb/clients/langchain-dxmt"
Repository = "https://github.com/dxmt/dxmt"
"Bug Tracker" = "https://github.com/dxmt/dxmt/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["langchain_dxmt*"]

[tool.setuptools.package-data]
langchain_dxmt = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Coverage is not in the default options: `pytest-cov` is a dev extra, and requiring a plugin
# to run the tests at all means a checkout without it fails at startup rather than running.
# Ask for it explicitly: `pytest --cov=langchain_dxmt --cov-report=term-missing`.
addopts = [
    "--strict-markers",
    "--strict-config",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs a running DXMT server (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["langchain_dxmt"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
