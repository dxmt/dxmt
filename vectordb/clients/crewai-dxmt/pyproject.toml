[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crewai-dxmt"
version = "1.6.0"
description = "DXMT as CrewAI's memory storage backend, knowledge storage and vector search tool"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "DXMT Team", email = "contact@dxmt.online" }]
requires-python = ">=3.10,<3.14"
keywords = ["crewai", "agent-memory", "dxmt", "vector-database", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The unified Memory (StorageBackend protocol, set_memory_storage_factory) arrived in crewai 1.15.
dependencies = [
    "crewai>=1.15.0,<2",
    "dxmt-python-sdk>=1.6.0,<2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "ruff>=0.1.0"]

[project.urls]
Homepage = "https://github.com/dxmt/dxmt"
Source = "https://github.com/dxmt/dxmt/tree/main/vectordb/clients/crewai-dxmt"
Issues = "https://github.com/dxmt/dxmt/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/crewai_dxmt"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: needs a running DXMT server (DXMT_HOST / DXMT_PORT)"]
