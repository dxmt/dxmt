[package]
name = "dxmt-vectordb"
version = "1.1.0"
edition = "2021"
authors = ["DXMT Team"]
description = "A lightweight single-node vector database written in Rust"
license = "Apache-2.0"
repository = "https://github.com/dxmt/dxmt"

[lib]
name = "dxmt_vectordb"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "vectordb"
path = "src/main.rs"
# The server binary is not part of Criterion benches.  Building it together
# with a benchmark enables the heavy release/LTO link and can exhaust memory
# before the benchmark itself is even compiled.
bench = false

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"
required-features = ["benchmarks"]

[[bin]]
name = "route_probe"
path = "src/bin/route_probe.rs"

[[bin]]
name = "loadgen_grpc"
path = "src/bin/loadgen_grpc.rs"
required-features = ["api-grpc"]

[[bin]]
name = "loadgen"
path = "src/bin/loadgen.rs"



# The one example that shows the whole basic loop: create, insert, search, filter, list,
# delete, drop. It runs correctly and was never declared here, so nothing built it and
# nothing would have said if it stopped working -- which is the only reason an example
# earns its place in the tree.
[[example]]
name = "quickstart"
path = "examples/quickstart.rs"

[[example]]
name = "mcp_demo"
path = "examples/mcp_demo.rs"

[[example]]
name = "hnsw_build_scaling"
path = "examples/hnsw_build_scaling.rs"

[[example]]
name = "full_text_search"
path = "examples/full_text_search_example.rs"
required-features = ["text-bm25"]

[[example]]
name = "grpc_client"
path = "examples/grpc_client.rs"
required-features = ["api-grpc"]

[[example]]
name = "dxql_demo"
path = "examples/dxql_demo.rs"

[[example]]
name = "chinese_tokenizer_demo"
path = "examples/chinese_tokenizer_demo.rs"
required-features = ["text-bm25"]



[dependencies]
# Core async runtime
tokio = { version = "1.36", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# High-performance I/O (removed io-uring due to macOS compatibility issues)

# Web framework
axum = { version = "0.6", features = ["macros", "ws"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.4", features = ["cors", "trace", "compression-br", "compression-gzip"] }

# GraphQL
async-graphql = { version = "5.0", features = ["uuid", "chrono"], optional = true }
async-graphql-axum = { version = "5.0", optional = true }

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde_yaml = "0.9"
bincode = "1.3"
rmp-serde = "1.1"  # MessagePack for WAL serialization (supports dynamic types)

# Data types and utilities
uuid = { version = "1.7", features = ["v4", "v5", "serde", "fast-rng"] }
chrono = { version = "0.4.31", features = ["serde"] }
bytes = "1.5"

# Vector and mathematical operations
ndarray = { version = "0.15", features = ["rayon", "serde"] }
nalgebra = { version = "0.32", default-features = false, features = ["std"] }
num-traits = "0.2"
num-bigint = "0.4"
num-complex = "0.4"
rayon = "1.8"

# Compression (unified versions)
zstd = "0.13"
lz4_flex = "0.11"
flate2 = "1.0"

# Memory and caching
lru = "0.12"
memmap2 = "0.9"
zerocopy = { version = "0.7", features = ["derive"] }

# Concurrency primitives
parking_lot = { version = "0.12", features = ["serde"] }
# Optional global allocator, behind the `jemalloc` feature.
#
# glibc gives each thread an arena and creates up to one per core; a 3 KB vector freed in
# one cannot satisfy a request in another. The insert path churns four 3 KB vectors per
# record and keeps two, so on 16 cores those per-arena free lists held 4.7 KB per record of
# the 16.2 KB measured -- and RSS was 34% worse on 16 cores than on 8 for that reason alone.
# glibc's own knob trades it back the wrong way: MALLOC_ARENA_MAX=2 cut RSS 29% and
# throughput 31%, because sixteen threads then contend on two arenas. jemalloc's per-thread
# caches and background page return address both sides at once.
tikv-jemallocator = { version = "0.6", optional = true }
crossbeam = "0.8"
crossbeam-channel = "0.5"
dashmap = "5.5"
oneshot = "0.1"

# System and OS interaction
libc = "0.2"
num_cpus = "1.16"
sysinfo = "0.30"
core_affinity = "0.8"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
log = "0.4"

# Configuration
config = { version = "0.14", features = ["toml", "json", "yaml"] }
toml = "0.8"
dotenv = "0.15"

# Cryptography and security
ring = "0.17"
aes-gcm = "0.10"
argon2 = "0.5"
sha2 = "0.10"
md5 = "0.7"
zeroize = { version = "1.7", features = ["derive"] }
subtle = "2.5"

# AWS and object storage
aws-config = { version = "1.1", default-features = false, features = ["rustls"], optional = true }
aws-sdk-s3 = { version = "1.15", default-features = false, features = ["rustls"], optional = true }
aws-smithy-async = { version = "1.2", features = ["rt-tokio"], optional = true }
reqwest = { version = "0.11", default-features = false, features = ["json", "stream", "rustls-tls"], optional = true }

# Distributed systems
tonic = { version = "0.11", optional = true }
prost = { version = "0.12", optional = true }

# Search and indexing
tantivy = { version = "0.25", optional = true }
jieba-rs = { version = "0.8", optional = true }
# In-process sampling profiler for the build-rate test under `benchmarks`: SIGPROF and
# backtraces, so it works where `perf_event_open` is locked down (perf_event_paranoid 4,
# ptrace_scope 1 -- the development box, as it happens), which is where a profile is
# otherwise impossible to get.
pprof = { version = "0.15", features = ["flamegraph"], optional = true }

# Graph processing (already exists, no need to add again)

# Query language parsing
pest = "2.7"
pest_derive = "2.7"

# Missing dependencies for new modules
# Multimodal support (optional) - using RC version, consider updating when stable

# GPU acceleration (optional)

# Data formats (temporarily disabled due to conflicts)
# arrow = { version = "50.0", features = ["prettyprint"] }

# Python bindings

# Utilities
once_cell = "1.19"
lazy_static = "1.4"
rand = { version = "0.8", features = ["small_rng"] }
rand_distr = "0.4"
regex = "1.10"
base64 = "0.22"
itertools = "0.12"
tempfile = "3.10"

# Performance and optimization
wide = "0.7"
crc32fast = "1.4"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# External services

# CLI and UI
clap = { version = "4.5", features = ["derive", "env"] }
colored = "2.1"

# OpenAPI documentation
utoipa = { version = "4.2", features = ["axum_extras"], optional = true }

# The dashboard's bundle, compiled into the binary.
#
# `mime-guess` resolves content types at compile time from the path, which is how `.mjs`,
# `.wasm` and `.woff2` avoid being served as `application/octet-stream`. `debug-embed` is not
# optional: without it a debug build reads the assets off disk at request time, and every
# integration test in this repo runs the debug binary -- the tests would then depend on the
# state of a directory rather than on the commit.
#
# It costs nothing new in the dependency graph. `rust-embed` and `mime_guess` were already
# resolved transitively; the crate that pulled them in was `utoipa-swagger-ui`, which was
# declared here, used nowhere in `src/`, and dragged axum 0.7.9 along beside the axum 0.6 this
# crate is built on. Removing that and declaring this is a net subtraction.
rust-embed = { version = "8.7", features = ["mime-guess", "debug-embed"], optional = true }
ordered-float = "5.0.0"
roaring = "0.11.2"
# Already in the graph through hashbrown; declared so the payload index can name its hasher.
# See `FastMap` in `src/storage/payload_index.rs` for why it is keyed rather than FxHash.
ahash = "0.8"
# Already in the graph through indexmap. `HashTable` lets the payload index keep each record id
# once instead of twice -- see `Ids` in `src/storage/payload_index.rs`.
hashbrown = { version = "0.15", default-features = false }
# axum 0.6 is built on hyper 0.14; keeping this dependency on the same
# version avoids two incompatible `tower_service` traits in the server binary.
hyper = "0.14.32"

[dev-dependencies]
# Testing frameworks
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
proptest = "1.4"

# Assertion and testing utilities
serial_test = "3.1"

# Additional test dependencies
# kmeans = "0.2" # Commented out due to packed_simd compilation issues
# rdkafka = { version = "0.35", default-features = false, features = ["cmake-build"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
overflow-checks = false

[profile.release-size]
inherits = "release"
opt-level = "z"
panic = "abort"

# Integration tests use Rust's unwind-based harness.  Keep the production
# release profile's smaller aborting panic strategy, while providing an
# optimized profile for release-level correctness/ANN measurements.
[profile.release-unwind]
inherits = "release"
panic = "unwind"
lto = false
codegen-units = 16
debug = false
strip = false

[profile.bench]
# Criterion needs optimized database code, but fat LTO over both the rlib and
# cdylib exhausts memory on normal development/CI machines before benchmarks
# can start. Benchmarks are intended for repeatable local/CI validation, so
# avoiding LTO entirely keeps linker memory and time bounded.
inherits = "release"
opt-level = 3
lto = false
codegen-units = 16
debug = false
strip = false

[profile.dev]
debug = true
opt-level = 0
incremental = true

# Dependency resolution overrides for compatibility
[patch.crates-io]
# If needed, we can patch specific dependencies here

# Feature flags for conditional compilation
[build-dependencies]
# Only compiled with `api-grpc`. `protoc-bin-vendored` ships the compiler itself, so building
# the gRPC surface does not require protoc to be installed on the machine.
tonic-build = { version = "0.11", optional = true }
protoc-bin-vendored = { version = "3.0", optional = true }

[features]
# The default build is the supported single-node Alpha surface. Heavy or experimental
# integrations must be opted into explicitly so a normal build does not require AWS, GraphQL,
# ONNX, or GPU toolchains.
# The dashboard and the OpenAPI document are part of what a person gets when they run this,
# not extras to opt into: a database you cannot look at, and whose API you cannot read, is
# harder to evaluate than one you can. `api-dashboard` compiles with no bundle present
# (`allow_missing`), so a checkout without Node still builds; the server then says so and
# serves everything else.
# `text-bm25` is default since 2026-10-02: hybrid retrieval is what an evaluator tries second,
# and `cargo run -- serve` answered it with FEATURE_DISABLED. It costs tantivy and jieba's
# dictionary at build time and nothing at run time until a table enables full text.
default = ["tokio-runtime", "basic-storage", "jemalloc", "api-swagger", "api-dashboard", "server-embedding", "text-bm25"]
experimental = [
    "benchmarks",
    "adaptive-index",
    "experimental-indexes",
]
tokio-runtime = []
basic-storage = []
benchmarks = ["pprof"]
adaptive-index = ["experimental-indexes"]
experimental-indexes = []
test-failpoints = []
s3-storage = ["aws-config", "aws-sdk-s3", "aws-smithy-async", "reqwest"]
text-bm25 = ["tantivy", "jieba-rs"]
api-graphql = ["async-graphql", "async-graphql-axum"]
api-swagger = ["utoipa"]
# The read-only web console at /dashboard. Off by default like every other interface, and
# served only when `--dashboard` is also passed.
api-dashboard = ["dep:rust-embed"]
api-ws = []
# gRPC, for the data path. Off by default like every other interface; see proto/dxmt.proto.
api-grpc = ["dep:tonic", "dep:prost", "dep:tonic-build", "dep:protoc-bin-vendored"]
# Server-side embedding: a table names a model, and records and queries may carry text
# instead of a vector. Default, because "can I send text" is the first thing an evaluator
# tries and a compile flag is a poor answer to it. It costs one HTTP client; nothing is
# called unless a table declares `embedding`.
server-embedding = ["reqwest"]
# `embeddings`, `gpu` and `simd` were here, and `multimodal` and `python` below. They gated
# about 9,300 lines that no route reached and no CI job compiled -- and of which `gpu` and
# `python` did not compile at all, which is how long a feature nobody builds can stay broken.
# All of it moved to `planning/src/` on 2026-09-27; `planning/README.md` says what each would
# take to become real. `server-embedding` above is the live path and stays.
#
# `cluster`, `consensus`, `hybrid-search` and `hf-datasets` went the same day for a related
# reason: they gated nothing. `cluster` had not compiled since `api/server_with_cluster.rs`
# moved to `planning/`, `consensus` was an empty feature enabling an absent module, and
# `hybrid-search`/`hf-datasets` appeared in no `cfg` anywhere in the tree -- `hybrid-search`
# in particular reads as the feature flag for `/search/hybrid`, which is `text-bm25`.
# Was an empty feature: `--features jemalloc` compiled and changed nothing. Now it swaps
# the global allocator, which is the point.
jemalloc = ["tikv-jemallocator"]




# ── Integration tests, declared rather than discovered ─────────────────────────────────────
#
# Cargo auto-discovers `tests/*.rs` and nothing else. These files live in scenario folders, so
# each one needs a `[[test]]` entry -- which is the reason this layout was chosen over
# aggregating them into a handful of binaries behind `include!`. A file that moves and is not
# declared **fails to build**; a `mod` line forgotten in an aggregator is silently never run,
# and this repository has already paid for that class of mistake more than once (CI naming four
# targets and skipping twenty-four; a feature-gated test file reporting `0 passed`).
#
# `name` is the file stem and must stay that way: `cargo test --test wal_recovery_test`, the
# Makefile and `.github/workflows/ci.yml` all address them by it.
#
# Generated, and kept in step by `tests/layout_test.rs`, which fails if a file under `tests/`
# has no entry or an entry points nowhere.


