[package]
name = "dxmt-vectordb"
version = "0.2.0"
edition = "2021"
authors = ["DXMT Team"]
description = "A lightweight, horizontally scalable vector database with storage native architecture"
license = "Apache-2.0"
repository = "https://github.com/dxmt/vectordb"

[lib]
name = "dxmt_vectordb"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "vectordb"
path = "src/main.rs"

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"



[[example]]
name = "hnsw_build_scaling"
path = "examples/hnsw_build_scaling.rs"

[[example]]
name = "full_text_search"
path = "examples/full_text_search_example.rs"

[[example]]
name = "dxql_demo"
path = "examples/dxql_demo.rs"

[[example]]
name = "chinese_tokenizer_demo"
path = "examples/chinese_tokenizer_demo.rs"
required-features = ["text-bm25"]



[dependencies]
# Core async runtime
tokio = { version = "1.36", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# High-performance I/O (removed io-uring due to macOS compatibility issues)

# Web framework
axum = { version = "0.6", features = ["macros", "ws"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.4", features = ["cors", "trace", "compression-br", "compression-gzip"] }

# GraphQL
async-graphql = { version = "5.0", features = ["uuid", "chrono"], optional = true }
async-graphql-axum = { version = "5.0", optional = true }

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde_yaml = "0.9"
bincode = "1.3"
rmp-serde = "1.1"  # MessagePack for WAL serialization (supports dynamic types)

# Data types and utilities
uuid = { version = "1.7", features = ["v4", "serde", "fast-rng"] }
chrono = { version = "0.4.31", features = ["serde"] }
bytes = "1.5"
byteorder = "1.5"

# Vector and mathematical operations
ndarray = { version = "0.15", features = ["rayon", "serde"] }
nalgebra = { version = "0.32", default-features = false, features = ["std"] }
num-traits = "0.2"
num-bigint = "0.4"
num-complex = "0.4"
rayon = "1.8"

# Compression (unified versions)
zstd = "0.13"
lz4_flex = "0.11"
flate2 = "1.0"

# Memory and caching
lru = "0.12"
moka = { version = "0.12", features = ["future"] }
memmap2 = "0.9"
zerocopy = { version = "0.7", features = ["derive"] }

# Concurrency primitives
parking_lot = "0.12"
crossbeam = "0.8"
crossbeam-channel = "0.5"
crossbeam-epoch = "0.9"
crossbeam-queue = "0.3"
crossbeam-utils = "0.8"
dashmap = "5.5"
oneshot = "0.1"

# System and OS interaction
libc = "0.2"
nix = { version = "0.27", features = ["fs", "uio", "zerocopy"] }
num_cpus = "1.16"
sysinfo = "0.30"
core_affinity = "0.8"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
log = "0.4"

# Configuration
config = { version = "0.14", features = ["toml", "json", "yaml"] }
toml = "0.8"
dotenv = "0.15"

# Cryptography and security
ring = "0.17"
aes-gcm = "0.10"
argon2 = "0.5"
sha2 = "0.10"
md5 = "0.7"
jsonwebtoken = "9.2"
zeroize = { version = "1.7", features = ["derive"] }
subtle = "2.5"

# AWS and object storage
aws-config = { version = "1.1", default-features = false, features = ["rustls"], optional = true }
aws-sdk-s3 = { version = "1.15", default-features = false, features = ["rustls"], optional = true }
aws-smithy-async = { version = "1.2", features = ["rt-tokio"], optional = true }
reqwest = { version = "0.11", default-features = false, features = ["json", "stream", "rustls-tls"], optional = true }

# Distributed systems
consul = { version = "0.4", optional = true }
tonic = { version = "0.11", optional = true }
prost = { version = "0.12", optional = true }
hash_ring = { version = "0.2", optional = true }
priority-queue = "1.3"

# Search and indexing
tantivy = { version = "0.25", optional = true }
jieba-rs = { version = "0.8", optional = true }

# LMDB storage backend
heed = { version = "0.20", optional = true }

# RocksDB storage backend
rocksdb = { version = "0.22", features = ["multi-threaded-cf"], optional = true }

# Graph processing (already exists, no need to add again)

# Query language parsing
pest = "2.7"
pest_derive = "2.7"

# Missing dependencies for new modules
backoff = { version = "0.4", features = ["tokio"] }
# Multimodal support (optional) - using RC version, consider updating when stable
ort = { version = "2.0.0-rc.10", optional = true }
statrs = "0.16"
image = { version = "0.24", features = ["jpeg", "png"], optional = true }
tokenizers = "0.15"

# GPU acceleration (optional)
cudarc = { version = "0.12", optional = true, features = ["cuda-11050"] }

# Data formats (temporarily disabled due to conflicts)
# arrow = { version = "50.0", features = ["prettyprint"] }
parquet = { version = "47.0", features = ["arrow", "async"], optional = true }
arrow = { version = "47.0", optional = true }

# Python bindings
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"], optional = true }

# Utilities
once_cell = "1.19"
lazy_static = "1.4"
rand = { version = "0.8", features = ["small_rng"] }
rand_distr = "0.4"
regex = "1.10"
base64 = "0.22"
itertools = "0.12"
petgraph = "0.6"
tempfile = "3.10"

# Performance and optimization
wide = "0.7"
crc32fast = "1.4"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# External services
redis = { version = "0.24", default-features = false, features = ["tokio-comp", "connection-manager"] }
prometheus = { version = "0.13", optional = true }

# CLI and UI
clap = { version = "4.5", features = ["derive", "env"] }
colored = "2.1"
indicatif = "0.17"
prettytable-rs = "0.10"

# OpenAPI documentation
utoipa = { version = "4.2", features = ["axum_extras"], optional = true }
utoipa-swagger-ui = { version = "6.0", features = ["axum"], optional = true }
ordered-float = "5.0.0"
roaring = "0.11.2"
hyper = "1.7.0"

[dev-dependencies]
# Testing frameworks
tokio-test = "0.4"
axum-test = "15.3"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
proptest = "1.4"
quickcheck = "1.0"
quickcheck_macros = "1.0"
rstest = "0.18"

# Assertion and testing utilities
pretty_assertions = "1.4"
approx = "0.5"
serial_test = "3.1"

# Additional test dependencies
half = "2.3"
# kmeans = "0.2" # Commented out due to packed_simd compilation issues
opentelemetry = { version = "0.21", default-features = false }
opentelemetry-otlp = { version = "0.14", default-features = false }
# rdkafka = { version = "0.35", default-features = false, features = ["cmake-build"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
overflow-checks = false

[profile.release-size]
inherits = "release"
opt-level = "z"
panic = "abort"

[profile.dev]
debug = true
opt-level = 0
incremental = true

[profile.bench]
inherits = "release"
debug = true

# Dependency resolution overrides for compatibility
[patch.crates-io]
# If needed, we can patch specific dependencies here

# Feature flags for conditional compilation
[features]
default = ["tokio-runtime", "basic-storage", "s3-storage", "text-bm25", "storage-lmdb", "api-swagger", "api-graphql"]
python = ["pyo3", "pyo3/extension-module"]
tokio-runtime = []
basic-storage = []
s3-storage = ["aws-config", "aws-sdk-s3", "aws-smithy-async", "reqwest"]
storage-lmdb = ["heed"]
storage-rocksdb = ["rocksdb"]
text-bm25 = ["tantivy", "jieba-rs"]
hybrid-search = ["text-bm25"]
api-graphql = ["async-graphql", "async-graphql-axum"]
api-swagger = ["utoipa", "utoipa-swagger-ui"]
api-ws = []
gpu = ["cudarc"]
simd = []
jemalloc = []
metrics = ["prometheus"]
cluster = ["consul", "tonic", "prost", "hash_ring"]
# Multimodal support (experimental - ONNX Runtime API changes in progress)
multimodal = ["ort", "image"]
# HuggingFace dataset integration
hf-datasets = ["parquet", "arrow", "reqwest"]




[[bench]]
name = "filter_performance_bench"
harness = false
required-features = ["text-bm25"]
