# Python tests for the server's HTTP surface. The Rust tests are `cargo test`; this file is
# only about `tests/api/`.
#
# `testpaths` is pinned deliberately. Without it a bare `pytest` in this directory also collects
# seven loose files in `tests/` (test_critical_issues.py, test_dxmt_autogen.py, ...) which
# nothing runs and several of which cannot pass -- test_dxmt_autogen.py imports
# `autogen_ext.memory.dxmt`, a module that exists in no repository. Checked before pinning: the
# only pytest invocation in CI is `dxmt-python-sdk/tests/test_integration.py`, a different
# directory, so this hides nothing that was running.
[pytest]
testpaths = tests/api
python_files = test_*.py
markers =
    slow: needs a generated corpus of thousands of records
addopts = -ra
