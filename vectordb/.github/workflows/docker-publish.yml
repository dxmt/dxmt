name: Docker Build and Push

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tags:
        description: 'Custom Docker tags (comma-separated)'
        required: false
        default: ''

env:
  DOCKER_REGISTRY: docker.io
  DOCKER_IMAGE: dxmt/vectordb
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  docker-build-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for accurate versioning

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKER_IMAGE }}
            ghcr.io/${{ github.repository }}
          tags: |
            # Tag with branch name for branch pushes
            type=ref,event=branch
            # Tag with PR number for pull requests
            type=ref,event=pr,prefix=pr-
            # Tag with semver for version tags (e.g., v1.2.3)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Tag with latest for main branch
            type=raw,value=latest,enable={{is_default_branch}}
            # Tag with commit SHA
            type=sha,prefix={{branch}}-,format=short
            # Custom tags if provided via workflow_dispatch
            type=raw,value=${{ github.event.inputs.tags }},enable=${{ github.event.inputs.tags != '' }}
          labels: |
            org.opencontainers.image.title=DXMT VectorDB
            org.opencontainers.image.description=Lightweight, horizontally scalable vector database
            org.opencontainers.image.vendor=DXMT
            org.opencontainers.image.licenses=Apache-2.0
            maintainer=DXMT Team

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            RUST_VERSION=1.75
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}
          provenance: true
          sbom: true

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

      - name: Image digest
        if: github.event_name != 'pull_request'
        run: |
          echo "Image pushed successfully!"
          echo "Digest: ${{ steps.build-push.outputs.digest }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"

      - name: Update Docker Hub Description
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ env.DOCKER_IMAGE }}
          short-description: 'DXMT VectorDB - Lightweight, scalable vector database for AI applications'
          readme-filepath: ./README.md

  docker-scan:
    name: Security Scan
    needs: docker-build-push
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Grype vulnerability scanner
        uses: anchore/scan-action@v3
        id: grype
        with:
          image: ${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}
          fail-build: false
          severity-cutoff: high

  test-docker-image:
    name: Test Docker Image
    needs: docker-build-push
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Pull Docker image
        run: |
          docker pull --platform=${{ matrix.platform }} ${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}

      - name: Test Docker image
        run: |
          # Start container
          docker run -d --name vectordb-test \
            --platform=${{ matrix.platform }} \
            -p 9999:9999 \
            ${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}

          # Wait for service to start
          sleep 10

          # Health check
          curl -f http://localhost:9999/health || exit 1

          # Stop container
          docker stop vectordb-test
          docker rm vectordb-test

      - name: Inspect image
        run: |
          docker inspect ${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}
          docker history ${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}

  notify:
    name: Notify Success
    needs: [docker-build-push, docker-scan, test-docker-image]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && success()

    steps:
      - name: Send notification
        run: |
          echo "✅ Docker image successfully built, scanned, and tested!"
          echo "Image: ${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}"
          echo "Platforms: ${{ env.PLATFORMS }}"
          echo "Event: ${{ github.event_name }}"
