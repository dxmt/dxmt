name: Test Presets

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      preset:
        description: 'Test preset to run'
        required: true
        default: 'normal'
        type: choice
        options:
          - fast
          - normal
          - comprehensive

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Fast preset: <5 minutes, unit tests only
  fast:
    name: Fast Tests (<5min)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.preset == 'fast')
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-fast-${{ hashFiles('**/Cargo.lock') }}

      - name: Run unit tests
        run: cargo test --lib --test unit
        timeout-minutes: 5

      - name: Run property tests (minimal)
        run: cargo test --test property
        env:
          PROPTEST_CASES: 20
        timeout-minutes: 2

  # Normal preset: <15 minutes, unit + integration tests
  normal:
    name: Normal Tests (<15min)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.preset == 'normal')
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-normal-${{ hashFiles('**/Cargo.lock') }}

      - name: Run all unit tests
        run: cargo test --lib
        timeout-minutes: 8

      - name: Run integration tests
        run: cargo test --test integration --test dataset_test --test recall_metrics_test
        timeout-minutes: 5

      - name: Run property tests
        run: cargo test --test property
        env:
          PROPTEST_CASES: 50
        timeout-minutes: 3

  # Comprehensive preset: <45 minutes, all tests + benchmarks
  comprehensive:
    name: Comprehensive Tests (<45min)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.preset == 'comprehensive'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-comprehensive-${{ hashFiles('**/Cargo.lock') }}

      - name: Run all tests
        run: cargo test --all
        timeout-minutes: 20

      - name: Run property tests (comprehensive)
        run: cargo test --test property
        env:
          PROPTEST_CASES: 200
        timeout-minutes: 10

      - name: Run benchmarks
        run: cargo test --test benchmarks
        timeout-minutes: 15

      - name: Generate coverage
        run: |
          cargo install cargo-tarpaulin
          cargo tarpaulin --verbose --all-features --workspace --timeout 300 --out Xml --output-dir coverage/
        timeout-minutes: 20

      - name: Check coverage thresholds
        run: |
          # Parse coverage XML and check thresholds
          line_coverage=$(grep -oP 'line-rate="\K[0-9.]+' coverage/cobertura.xml | head -1)
          branch_coverage=$(grep -oP 'branch-rate="\K[0-9.]+' coverage/cobertura.xml | head -1)

          line_pct=$(awk "BEGIN {print $line_coverage * 100}")
          branch_pct=$(awk "BEGIN {print $branch_coverage * 100}")

          echo "Line coverage: ${line_pct}%"
          echo "Branch coverage: ${branch_pct}%"

          # Fail if below thresholds
          if (( $(echo "$line_pct < 70" | bc -l) )); then
            echo "❌ Line coverage ${line_pct}% is below 70% threshold"
            exit 1
          fi

          if (( $(echo "$branch_pct < 60" | bc -l) )); then
            echo "❌ Branch coverage ${branch_pct}% is below 60% threshold"
            exit 1
          fi

          echo "✅ Coverage thresholds met"

      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        with:
          file: coverage/cobertura.xml
          fail_ci_if_error: true

  # Benchmark regression detection
  benchmark-regression:
    name: Benchmark Regression Detection
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}

      - name: Run benchmarks on PR branch
        run: cargo bench --no-fail-fast -- --save-baseline pr
        timeout-minutes: 15

      - name: Checkout base branch
        run: |
          git fetch origin ${{ github.base_ref }}
          git checkout origin/${{ github.base_ref }}

      - name: Run benchmarks on base branch
        run: cargo bench --no-fail-fast -- --save-baseline base
        timeout-minutes: 15

      - name: Compare benchmarks
        run: |
          cargo install cargo-criterion
          cargo criterion --message-format json > criterion-results.json

          # Check for regressions >5%
          python3 << 'EOF'
          import json
          import sys

          threshold = 0.05  # 5% regression threshold
          regressions = []

          try:
              with open('criterion-results.json') as f:
                  for line in f:
                      if line.strip():
                          data = json.loads(line)
                          if data.get('reason') == 'benchmark-complete':
                              change = data.get('change', {})
                              if change and change.get('mean', 0) > threshold:
                                  bench_name = data.get('id', 'unknown')
                                  pct_change = change['mean'] * 100
                                  regressions.append(f"  - {bench_name}: +{pct_change:.1f}%")
          except FileNotFoundError:
              print("⚠️  No benchmark results found")
              sys.exit(0)

          if regressions:
              print("❌ Performance regressions detected (>5%):")
              for r in regressions:
                  print(r)
              sys.exit(1)
          else:
              print("✅ No significant performance regressions")
          EOF
        timeout-minutes: 5

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [fast, normal]
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.fast.result }}" == "failure" ] || [ "${{ needs.normal.result }}" == "failure" ]; then
            echo "❌ Some tests failed"
            exit 1
          else
            echo "✅ All tests passed"
          fi
