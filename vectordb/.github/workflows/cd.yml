name: CD Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  RUST_VERSION: 1.75
  DOCKER_REGISTRY: docker.io/dxmt

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            dxmt/vectordb
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    needs: [build-and-push]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name vectordb-staging --region us-east-1
      
      - name: Deploy to staging
        run: |
          helm upgrade --install vectordb-staging deploy/helm/vectordb \
            --namespace vectordb-staging \
            --create-namespace \
            --set image.tag=${{ needs.build-and-push.outputs.version }} \
            --set environment=staging \
            --set replicaCount=3 \
            --wait \
            --timeout 10m
      
      - name: Run smoke tests
        run: |
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=vectordb -n vectordb-staging --timeout=300s
          ./deploy/scripts/health-check.sh staging

  deploy-production:
    name: Deploy to Production
    needs: [build-and-push, deploy-staging]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.environment == 'production'
    environment: production
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name vectordb-prod --region us-east-1
      
      - name: Check DR readiness
        run: ./deploy/scripts/disaster-recovery.sh status production
      
      - name: Deploy to production (Blue-Green)
        run: |
          # Deploy to green environment
          helm upgrade --install vectordb-green deploy/helm/vectordb \
            --namespace vectordb \
            --set image.tag=${{ needs.build-and-push.outputs.version }} \
            --set environment=production \
            --set deployment.slot=green \
            --set replicaCount=5 \
            --wait \
            --timeout 15m
          
          # Run validation
          ./deploy/scripts/health-check.sh production
          
          # Switch traffic to green
          kubectl patch service vectordb -n vectordb -p '{"spec":{"selector":{"deployment.slot":"green"}}}'
          
          # Wait for traffic to stabilize
          sleep 60
          
          # Scale down blue deployment
          kubectl scale deployment vectordb-blue -n vectordb --replicas=0 || true
      
      - name: Create release notes
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: |
            ## Changes in this Release
            - Docker image: `${{ needs.build-and-push.outputs.image-tag }}`
            - Deployed to production
            
            ## Deployment Details
            - Environment: Production
            - Region: us-east-1
            - Replicas: 5
          draft: false
          prerelease: false

  rollback:
    name: Rollback Production
    runs-on: ubuntu-latest
    if: failure() && needs.deploy-production.result == 'failure'
    needs: [deploy-production]
    environment: production
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name vectordb-prod --region us-east-1
      
      - name: Rollback to blue deployment
        run: |
          # Scale up blue deployment
          kubectl scale deployment vectordb-blue -n vectordb --replicas=5
          
          # Wait for blue to be ready
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=vectordb,deployment.slot=blue -n vectordb --timeout=300s
          
          # Switch traffic back to blue
          kubectl patch service vectordb -n vectordb -p '{"spec":{"selector":{"deployment.slot":"blue"}}}'
          
          # Delete failed green deployment
          helm uninstall vectordb-green -n vectordb || true
      
      - name: Notify rollback
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              text: "Production deployment rolled back",
              attachments: [{
                color: 'warning',
                text: 'Production deployment failed and was rolled back to previous version'
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}