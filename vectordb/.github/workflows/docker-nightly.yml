name: Docker Nightly Build

on:
  schedule:
    # Run every day at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  DOCKER_REGISTRY: docker.io
  DOCKER_IMAGE: dxmt/vectordb
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  nightly-build:
    name: Build Nightly Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: develop  # Build from develop branch

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate nightly tag
        id: nightly-tag
        run: |
          NIGHTLY_TAG="nightly-$(date +'%Y%m%d')"
          echo "tag=$NIGHTLY_TAG" >> $GITHUB_OUTPUT
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push nightly image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:nightly
            ${{ env.DOCKER_IMAGE }}:${{ steps.nightly-tag.outputs.tag }}
            ghcr.io/${{ github.repository }}:nightly
            ghcr.io/${{ github.repository }}:${{ steps.nightly-tag.outputs.tag }}
          labels: |
            org.opencontainers.image.title=DXMT VectorDB Nightly
            org.opencontainers.image.description=Nightly build of DXMT VectorDB
            org.opencontainers.image.version=nightly
            org.opencontainers.image.revision=${{ steps.nightly-tag.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_TYPE=nightly

      - name: Test nightly image
        run: |
          docker run -d --name vectordb-nightly -p 9999:9999 ${{ env.DOCKER_IMAGE }}:nightly
          sleep 10
          curl -f http://localhost:9999/health || exit 1
          docker stop vectordb-nightly

      - name: Cleanup old nightly images
        run: |
          echo "Nightly build completed: ${{ steps.nightly-tag.outputs.tag }}"
          echo "Note: Cleanup of old images should be done via Docker Hub retention policies"
