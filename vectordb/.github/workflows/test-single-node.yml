name: Single Node Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Run with debug logging'
        required: false
        default: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_LOG: info

jobs:
  single-node-functional:
    name: Single Node Functional Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-single-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install Python dependencies
        run: |
          pip install -r scripts/requirements.txt || pip install requests numpy pytest pytest-asyncio
      
      - name: Build VectorDB
        run: |
          cargo build --release --bin vectordb
          cargo build --release --bin standalone_server
      
      - name: Start single node server
        run: |
          # Start the server in the background
          ./target/release/standalone_server &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          
          # Wait for server to be ready
          echo "Waiting for server to start..."
          for i in {1..30}; do
            if curl -f http://localhost:8000/status 2>/dev/null; then
              echo "Server is ready!"
              break
            fi
            sleep 2
          done
      
      - name: Run functional tests
        run: |
          # Basic CRUD operations
          echo "Testing basic CRUD operations..."
          ./scripts/test/simple_test.sh || true
          
          # Detailed API tests
          echo "Testing detailed API operations..."
          ./scripts/test/detailed_test.sh || true
          
          # Python integration tests
          echo "Running Python integration tests..."
          python3 scripts/test/api_test.py || true
      
      - name: Test data persistence
        run: |
          # Insert test data
          curl -X POST http://localhost:8000/tables \
            -H "Content-Type: application/json" \
            -d '{"name":"test_persist","dimension":128,"distance_metric":"Cosine"}'
          
          curl -X POST http://localhost:8000/tables/test_persist/records \
            -H "Content-Type: application/json" \
            -d '{"records":[{"id":"test1","vector":[0.1,0.2,0.3],"payload":{"test":true}}]}'
          
          # Restart server
          kill ${{ env.SERVER_PID }}
          sleep 5
          ./target/release/standalone_server &
          NEW_PID=$!
          sleep 10
          
          # Verify data persists
          curl http://localhost:8000/tables/test_persist
          
          # Cleanup
          kill $NEW_PID
      
      - name: Cleanup
        if: always()
        run: |
          pkill -f standalone_server || true
          pkill -f vectordb || true

  single-node-performance:
    name: Single Node Performance Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-perf-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install numpy requests matplotlib pandas psutil
      
      - name: Build release binary
        run: cargo build --release --bin standalone_server
      
      - name: Start server for performance testing
        run: |
          ./target/release/standalone_server &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          sleep 10
      
      - name: Run insert performance test
        run: |
          python3 << 'EOF'
          import requests
          import numpy as np
          import time
          import json
          
          # Create table
          requests.post("http://localhost:8000/tables", json={
              "name": "perf_test",
              "dimension": 768,
              "distance_metric": "Cosine"
          })
          
          # Measure insert performance
          print("Testing insert performance...")
          batch_sizes = [100, 500, 1000]
          for batch_size in batch_sizes:
              records = []
              for i in range(batch_size):
                  records.append({
                      "id": f"vec_{i}",
                      "vector": np.random.rand(768).tolist(),
                      "payload": {"batch": batch_size, "index": i}
                  })
              
              start = time.time()
              response = requests.post(
                  "http://localhost:8000/tables/perf_test/records",
                  json={"records": records}
              )
              elapsed = time.time() - start
              
              if response.status_code == 200:
                  throughput = batch_size / elapsed
                  print(f"Batch {batch_size}: {throughput:.2f} vectors/sec, {elapsed:.3f}s total")
              else:
                  print(f"Batch {batch_size} failed: {response.status_code}")
          EOF
      
      - name: Run query performance test
        run: |
          python3 << 'EOF'
          import requests
          import numpy as np
          import time
          import statistics
          
          print("Testing query performance...")
          
          # Run multiple queries
          latencies = []
          for i in range(100):
              query_vector = np.random.rand(768).tolist()
              
              start = time.time()
              response = requests.post(
                  "http://localhost:8000/tables/perf_test/search",
                  json={
                      "vector": query_vector,
                      "top_k": 10
                  }
              )
              latency = (time.time() - start) * 1000  # Convert to ms
              
              if response.status_code == 200:
                  latencies.append(latency)
          
          if latencies:
              print(f"Query Latency Stats:")
              print(f"  Mean: {statistics.mean(latencies):.2f}ms")
              print(f"  P50: {statistics.median(latencies):.2f}ms")
              print(f"  P95: {statistics.quantiles(latencies, n=20)[18]:.2f}ms")
              print(f"  P99: {statistics.quantiles(latencies, n=100)[98]:.2f}ms")
              print(f"  Min: {min(latencies):.2f}ms")
              print(f"  Max: {max(latencies):.2f}ms")
          EOF
      
      - name: Run concurrent load test
        run: |
          python3 << 'EOF'
          import requests
          import numpy as np
          import time
          import concurrent.futures
          import threading
          
          def query_worker(thread_id, num_queries):
              latencies = []
              errors = 0
              
              for i in range(num_queries):
                  try:
                      query_vector = np.random.rand(768).tolist()
                      start = time.time()
                      response = requests.post(
                          "http://localhost:8000/tables/perf_test/search",
                          json={"vector": query_vector, "top_k": 5},
                          timeout=5
                      )
                      latency = (time.time() - start) * 1000
                      
                      if response.status_code == 200:
                          latencies.append(latency)
                      else:
                          errors += 1
                  except Exception as e:
                      errors += 1
              
              return latencies, errors
          
          print("Testing concurrent load...")
          num_threads = 10
          queries_per_thread = 50
          
          start_time = time.time()
          with concurrent.futures.ThreadPoolExecutor(max_workers=num_threads) as executor:
              futures = [
                  executor.submit(query_worker, i, queries_per_thread)
                  for i in range(num_threads)
              ]
              
              all_latencies = []
              total_errors = 0
              
              for future in concurrent.futures.as_completed(futures):
                  latencies, errors = future.result()
                  all_latencies.extend(latencies)
                  total_errors += errors
          
          elapsed = time.time() - start_time
          total_queries = num_threads * queries_per_thread
          successful_queries = len(all_latencies)
          qps = successful_queries / elapsed
          
          print(f"Concurrent Load Test Results:")
          print(f"  Total Queries: {total_queries}")
          print(f"  Successful: {successful_queries}")
          print(f"  Errors: {total_errors}")
          print(f"  QPS: {qps:.2f}")
          print(f"  Duration: {elapsed:.2f}s")
          
          if all_latencies:
              import statistics
              print(f"  Avg Latency: {statistics.mean(all_latencies):.2f}ms")
              print(f"  P95 Latency: {statistics.quantiles(all_latencies, n=20)[18]:.2f}ms")
          EOF
      
      - name: Memory usage test
        run: |
          python3 << 'EOF'
          import psutil
          import requests
          import numpy as np
          import time
          
          # Find the server process
          for proc in psutil.process_iter(['pid', 'name', 'cmdline']):
              if 'standalone_server' in str(proc.info['cmdline']):
                  server_proc = psutil.Process(proc.info['pid'])
                  break
          else:
              print("Server process not found")
              exit(1)
          
          print("Memory Usage Test:")
          initial_memory = server_proc.memory_info().rss / 1024 / 1024  # MB
          print(f"Initial memory: {initial_memory:.2f}MB")
          
          # Insert large batch
          large_batch = []
          for i in range(5000):
              large_batch.append({
                  "id": f"mem_test_{i}",
                  "vector": np.random.rand(768).tolist(),
                  "payload": {"test": "memory", "index": i}
              })
          
          requests.post("http://localhost:8000/tables", json={
              "name": "memory_test",
              "dimension": 768,
              "distance_metric": "Cosine"
          })
          
          # Insert in chunks
          chunk_size = 500
          for i in range(0, len(large_batch), chunk_size):
              chunk = large_batch[i:i+chunk_size]
              requests.post(
                  "http://localhost:8000/tables/memory_test/records",
                  json={"records": chunk}
              )
              time.sleep(1)
          
          final_memory = server_proc.memory_info().rss / 1024 / 1024  # MB
          memory_increase = final_memory - initial_memory
          
          print(f"Final memory: {final_memory:.2f}MB")
          print(f"Memory increase: {memory_increase:.2f}MB")
          print(f"Memory per vector: {memory_increase * 1024 / len(large_batch):.2f}KB")
          EOF
      
      - name: Generate performance report
        run: |
          echo "## Single Node Performance Report" > performance_report.md
          echo "" >> performance_report.md
          echo "Date: $(date)" >> performance_report.md
          echo "Commit: ${{ github.sha }}" >> performance_report.md
          echo "" >> performance_report.md
          echo "### Test Results" >> performance_report.md
          echo "See workflow logs for detailed metrics" >> performance_report.md
      
      - name: Upload performance report
        uses: actions/upload-artifact@v3
        with:
          name: single-node-performance-report
          path: performance_report.md
      
      - name: Cleanup
        if: always()
        run: |
          kill ${{ env.SERVER_PID }} || true
          pkill -f standalone_server || true

  single-node-stress:
    name: Single Node Stress Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Build release binary
        run: cargo build --release --bin standalone_server
      
      - name: Run stress test
        run: |
          # Start server
          ./target/release/standalone_server &
          SERVER_PID=$!
          sleep 10
          
          # Run stress test for 2 minutes
          timeout 120 bash -c '
          while true; do
            curl -X POST http://localhost:8000/tables \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"stress_$(date +%s)\",\"dimension\":128}" &
            
            curl http://localhost:8000/tables &
            
            sleep 0.1
          done
          ' || true
          
          # Check if server is still responsive
          curl http://localhost:8000/status
          
          # Cleanup
          kill $SERVER_PID