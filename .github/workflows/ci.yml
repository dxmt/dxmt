name: CI

# The crate lives in vectordb/, but GitHub Actions only reads .github/ at the repository root.
# Nine workflows used to sit in vectordb/.github/workflows/ where nothing could trigger them —
# and they invoked cargo at the checkout root with no working-directory, so they would have
# failed on the first step even if they had. This file replaces the lot.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request supersedes the run on its previous head; that run is cancelled
# rather than left to finish an hour of work nobody will read. Runs on main are never
# cancelled, so every commit that lands there gets a complete result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No CARGO_BUILD_JOBS: it was 1, which compiled on one of the runner's four cores and made
# compilation most of every job's wall time. The runners have 16 GB, and a four-way debug
# build without debuginfo fits in it.
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: -C debuginfo=0

defaults:
  run:
    working-directory: vectordb

jobs:
  verify:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned; vectordb/rust-toolchain.toml says why. Keep the two versions equal.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vectordb

      # Not `make verify`: the same three steps, but named separately so a failure says which
      # one without reading the log. Note cargo fmt is not idempotent on this tree — if this
      # step fails after a local `cargo fmt`, run it a second time.
      - name: Formatting
        run: cargo fmt -- --check

      # All test targets are part of the supported default build. Keep the feature-gated
      # experimental tests out of this job, while making the default surface warning-free.
      - name: Clippy (all default targets)
        run: cargo clippy --all-targets -- -D warnings

      # The unit tests stay here as the quick signal. The integration tests run once, in
      # `optional-features` below: its feature list is the default set plus test-only and
      # opt-in features that add code without changing what the default build does (the
      # failpoints are inert until a test arms them), so it runs every default integration test
      # and the gated ones too. Running `cargo test --tests` here as well was the same ~25
      # minutes twice.
      - name: Unit tests
        run: cargo test --lib

  minimal-core:
    name: minimal feature compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned; vectordb/rust-toolchain.toml says why. Keep the two versions equal.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vectordb
      # This job checks the supported single-node core without optional text, remote, or
      # experimental integrations. The text feature has a separate compile check below.
      - run: cargo check --no-default-features --features tokio-runtime,basic-storage

      - name: Text feature compile
        run: cargo check --no-default-features --features tokio-runtime,basic-storage,text-bm25

  # The crate did not compile on aarch64 -- one AVX2 function was missing its
  # `cfg(target_arch)` -- and nothing noticed until the release workflow built an ARM binary.
  # Native, on GitHub's ARM runner, so the unit tests exercise the non-x86 distance paths.
  aarch64:
    name: aarch64 clippy and unit tests
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      # Pinned; vectordb/rust-toolchain.toml says why. Keep the two versions equal.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vectordb
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --lib

  optional-features:
    name: optional features, compile and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned; vectordb/rust-toolchain.toml says why. Keep the two versions equal.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vectordb
      # Everything here used to be in `default`, so it was compiled by every job. Now that the
      # default build is the minimal supported surface, nothing else would ever build these —
      # and the conditional compilation that gates them is exactly the kind of code that rots
      # unseen. `--all-targets` because the cfg work reaches into the test targets too.
      # `clippy -D warnings`, not `check`: the default build already holds that bar, and the
      # first strict run over the gated code found a lint in the WAL failpoint that nothing had
      # ever compiled under `-D warnings`. A weaker gate here means the opt-in features drift
      # to a different standard than the code they sit next to.
      - name: API and text integrations
        run: cargo clippy --all-targets --features text-bm25,api-swagger,api-graphql,api-ws,api-grpc,api-dashboard -- -D warnings

      - name: Object store backend
        run: cargo check --features s3-storage

      # The feature-gated test files (benchmarks, dataset, phase 3, the failpoint suite) compile
      # to nothing in the default build. Without this step they are not merely unrun, they are
      # unbuilt, and they rot against the code they test.
      - name: Feature-gated test targets
        run: >
          cargo clippy --all-targets
          --features benchmarks,adaptive-index,experimental-indexes,test-failpoints,api-grpc,text-bm25
          -- -D warnings

      # This is the integration-test run for the whole crate: `--tests`, not a hand-picked
      # subset, because naming individual targets is how a suite quietly stops being run. These
      # spawn the server binary and exercise recovery, snapshots, the MCP transport and the
      # routes the client SDKs call -- a lost write, a 404 on a documented endpoint, a log line
      # on MCP's stdout.
      #
      # Compiling a test is not running it. Before this step the dataset, recall-metric and
      # hierarchical-clustering suites had never executed anywhere -- the default build compiles
      # them to nothing -- and two of their tests went on importing types that had been taken
      # out of the crate, unnoticed, because the clippy step above was itself naming a feature that no
      # longer existed. Same feature list as the clippy step, so the two cannot drift.
      # `text-bm25` is in this list for a reason that has nothing to do with the features above
      # it. Two test *files* open with `#![cfg(feature = "text-bm25")]` --
      # `restart_equivalence_test.rs` and `full_text_recovery_test.rs` -- and no job enabled it
      # for `cargo test`: `verify` runs the default build, and this list did not name it. Both
      # therefore reported `running 0 tests` everywhere, which is the failure mode the comment
      # at the top of this file warns about and is invisible in a green log. The second of them
      # is what guards the table-id / Tantivy-directory bug that left 135 orphaned index
      # directories behind five tables.
      - name: Feature-gated tests
        run: >
          cargo test --tests
          --features benchmarks,adaptive-index,experimental-indexes,test-failpoints,api-grpc,text-bm25

  build:
    name: release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned; vectordb/rust-toolchain.toml says why. Keep the two versions equal.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vectordb
      - run: cargo build --release --bins

  # This job, `dashboard` and `sdk-live` used to wait for `verify` (`needs: verify`), so they
  # started some 45 minutes into a run. Each builds its own server, so they run alongside it.
  functional-full-text:
    name: functional API tests with text-bm25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned; vectordb/rust-toolchain.toml says why. Keep the two versions equal.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vectordb
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # The default build has no full-text search and no Swagger, so everywhere else the four
      # tests in tests/api/test_full_text.py and the five in tests/api/test_openapi_examples.py
      # skip themselves -- and a skipped test is an absent one. This builds the server with both
      # features and runs the whole suite in both storage modes. DXMT_FEATURES also turns those
      # skips into failures, so a build that quietly lost a feature cannot pass, and it is what
      # makes the script start the server with `--swagger`. Its own job rather than a step in
      # sdk-live: that job already has target/debug/vectordb running, and rebuilding over a
      # running binary fails.
      - name: Functional API tests with text-bm25 and api-swagger (memory and disk)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/api/requirements.txt
          DXMT_FEATURES=text-bm25,api-swagger scripts/api_tests.sh -q

  dashboard:
    name: web console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned; vectordb/rust-toolchain.toml says why. Keep the two versions equal.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vectordb
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vectordb/dashboard/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The bundle has to exist before the Rust build, because it is embedded into the binary.
      # `rust-embed`'s `allow_missing` is what lets every *other* job compile this code without
      # Node; the price of that is a binary that links with no assets, so the server refuses to
      # start with --dashboard, and `tests/dashboard_test.rs` skips (it reads dashboard/dist/
      # to decide). This job is the one that builds the bundle, so here it must not skip.
      - name: Build the console
        run: npm ci && npm run lint && npm test && npm run build
        working-directory: vectordb/dashboard

      - name: Serving, caching and the read-only contract
        run: cargo test --features api-dashboard --test dashboard_test

      # Only this one file, and only one storage mode: serving static bytes does not depend on
      # where the records live, and the rest of the suite already runs twice elsewhere.
      - name: Every asset and route the page needs
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/api/requirements.txt
          DXMT_FEATURES=api-dashboard DXMT_MODES=memory DXMT_SKIP_STATEFUL=1 scripts/api_tests.sh -q tests/api/test_dashboard.py

  sdk-live:
    name: Python and JavaScript SDK live contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned; vectordb/rust-toolchain.toml says why. Keep the two versions equal.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            vectordb
            vectordb/clients/dxmt-rust-sdk

      - name: Build server binary
        run: cargo build --bin vectordb
        working-directory: vectordb

      - name: Start server
        run: |
          mkdir -p "$RUNNER_TEMP/dxmt-sdk-backups"
          DXMT_WAL_DIR="$RUNNER_TEMP/dxmt-sdk-wal" \
          DXMT_BACKUP_ROOT="$RUNNER_TEMP/dxmt-sdk-backups" \
          DXMT_SNAPSHOT_INTERVAL_SECS=0 \
          DXMT_EVICTION_INTERVAL_SECS=0 \
          target/debug/vectordb serve --host 127.0.0.1 --port 19999 >"$RUNNER_TEMP/dxmt-sdk-server.log" 2>&1 &
          for i in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:19999/health >/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/dxmt-sdk-server.log"
          exit 1
        working-directory: vectordb

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Starts its own servers on ephemeral ports, one per storage mode, so it does not touch
      # the :19999 server the SDK tests below use. Its own requirements file rather than the
      # SDK's `[dev]` extra installed by the next step, so the two steps do not depend on order.
      - name: Functional API tests (memory and disk)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/api/requirements.txt
          DXMT_SKIP_BUILD=1 scripts/api_tests.sh -q
        working-directory: vectordb

      - name: Python SDK live tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          DXMT_TEST_HOST=127.0.0.1 DXMT_TEST_PORT=19999 DXMT_BACKUP_ROOT="$RUNNER_TEMP/dxmt-sdk-backups" \
            pytest -q tests/test_integration.py
        working-directory: vectordb/clients/dxmt-python-sdk

      # Every example, run as a user runs it, judged by its exit status (0 pass, 77 skip,
      # anything else fail). numpy is installed because it is cheap and three examples need
      # it; torch, sentence-transformers and openai are not, so the examples that need them
      # skip here with their reason, and the ones that need only the SDK must pass. Nothing
      # ran the examples before this, and one had never worked since it entered the tree.
      - name: Python SDK examples
        run: |
          python -m pip install numpy
          DXMT_TEST_HOST=127.0.0.1 DXMT_TEST_PORT=19999 pytest -q -rs tests/test_examples.py
        working-directory: vectordb/clients/dxmt-python-sdk

      # The LangGraph store implements BaseStore over DXMT, and nothing ran it: `langgraph` is
      # not a dependency of this SDK, so `importorskip` skipped the whole file everywhere --
      # including here -- and seven of its tests had been failing for some time behind that
      # skip. Installing the one package is what turns them back into a gate.
      - name: LangGraph store tests
        run: |
          python -m pip install langgraph
          DXMT_TEST_HOST=127.0.0.1 DXMT_TEST_PORT=19999 pytest -q \
            tests/test_langgraph_store.py tests/test_langgraph_store_integration.py
        working-directory: vectordb/clients/dxmt-python-sdk

      # The two adapter packages had no CI at all, and both had gone red without anyone
      # noticing: a test importing a class name this package never exported, and one asserting
      # a single filter unwrapped -- which the server does not reject, it reads as a filter
      # with no conditions and returns everything. They run here rather than in a job of their
      # own because the payload round trip is only worth asserting against a real server, and
      # this job has one. Order matters: the step above installed `dxmt-python-sdk` editable
      # from this checkout, which is what satisfies both packages' dependency on it -- there is
      # no such distribution on PyPI, and a non-editable resolution would test the adapters
      # against an SDK this commit does not contain.
      # The Rust client is the third one that has to keep working against a real server, and
      # the only one whose tests compile. `--test live --test api_key` rather than `cargo test`:
      # the doctest in lib.rs is `no_run`, so building it adds a link step that proves nothing
      # here. `api_key` was left out when this read `--test live` alone, so the one test that
      # proves the key reaches the wire -- against a local listener, no server needed -- ran on
      # developer machines and nowhere else.
      - name: Rust client tests, live and api-key
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets -- -D warnings
          DXMT_URL=http://127.0.0.1:19999 cargo test --test live --test api_key
        working-directory: vectordb/clients/dxmt-rust-sdk

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Go client live tests
        run: DXMT_URL=http://127.0.0.1:19999 go test ./...
        working-directory: vectordb/clients/dxmt-go-sdk

      # `langchain-tests` carries LangChain's official VectorStore conformance suite, and
      # installing it is what makes that suite run at all. Before this, 50 tests in this
      # package -- the conformance suite plus the two live files -- skipped themselves
      # everywhere: they needed `langchain-openai`, `OPENAI_API_KEY`, and a provider that
      # actually serves embeddings, and CI has none of the three. They embed locally now
      # (`tests/local_embedding.py`), so the only thing still missing was this line. The
      # skip message used to say `pip install langchain-standard-tests`, which is the name
      # the package had before it was renamed and is not on PyPI, so following the
      # instruction could not work either.
      - name: LangChain adapter tests
        run: |
          python -m pip install -e . langchain-tests
          DXMT_HOST=127.0.0.1 DXMT_PORT=19999 pytest -q
        working-directory: vectordb/clients/langchain-dxmt

      # `tests/test_integration.py` here asked for `OpenAIEmbedding`, so it skipped itself on
      # every machine without a key -- this one included -- and the package's live path was
      # never exercised at all. It now embeds locally, so these are real.
      - name: LlamaIndex adapter tests
        run: |
          python -m pip install -e .
          DXMT_HOST=127.0.0.1 DXMT_PORT=19999 pytest -q
        working-directory: vectordb/clients/llama-index-vector-stores-dxmt

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JavaScript SDK unit, build, and live tests
        run: |
          npm ci
          npm test
          npm run build
          DXMT_LIVE_URL=http://127.0.0.1:19999 DXMT_BACKUP_ROOT="$RUNNER_TEMP/dxmt-sdk-backups" \
            npm test -- --run test/live.test.ts test/langchain-live.test.ts
        working-directory: vectordb/clients/dxmt-js-sdk

      # Every client again, against a server that requires a key. On the test side
      # `DXMT_API_KEY` is read only by each suite's harness -- the SDKs read no environment
      # themselves -- and the two curls first prove the server really refuses a keyless request
      # and accepts a keyed one, or this could pass against a server with authentication off.
      - name: Start a server that requires an API key
        run: |
          DXMT_WAL_DIR="$RUNNER_TEMP/dxmt-sdk-keyed-wal" \
          DXMT_SNAPSHOT_INTERVAL_SECS=0 \
          DXMT_EVICTION_INTERVAL_SECS=0 \
          DXMT_API_KEY=ci-live-key \
          target/debug/vectordb serve --host 127.0.0.1 --port 19998 >"$RUNNER_TEMP/dxmt-sdk-keyed.log" 2>&1 &
          for i in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:19998/health >/dev/null && break
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:19998/api/v1/tables)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'api-key: ci-live-key' http://127.0.0.1:19998/api/v1/tables)" = 200
        working-directory: vectordb

      - name: Every client against the keyed server
        env:
          DXMT_API_KEY: ci-live-key
        run: |
          (cd clients/dxmt-python-sdk && DXMT_TEST_HOST=127.0.0.1 DXMT_TEST_PORT=19998 pytest -q tests/test_integration.py)
          (cd clients/dxmt-rust-sdk && DXMT_URL=http://127.0.0.1:19998 cargo test --test live)
          (cd clients/dxmt-go-sdk && DXMT_URL=http://127.0.0.1:19998 go test ./...)
          (cd clients/langchain-dxmt && DXMT_HOST=127.0.0.1 DXMT_PORT=19998 pytest -q)
          (cd clients/llama-index-vector-stores-dxmt && DXMT_HOST=127.0.0.1 DXMT_PORT=19998 pytest -q)
          (cd clients/dxmt-js-sdk && DXMT_LIVE_URL=http://127.0.0.1:19998 npm test -- --run test/live.test.ts test/langchain-live.test.ts)
        working-directory: vectordb
