# Prebuilt binaries for Linux and macOS, with the web console compiled in, and a container
# image of the Linux ones.
#
# A pushed `vX.Y.Z` tag builds them and attaches them to that tag's GitHub release -- creating
# it as a draft, from the CHANGELOG section, if it does not exist yet, so nothing is published
# without someone pressing the button. A pull request that touches this file builds and
# smoke-tests everything and publishes nothing: that is how a change here is tried.
#
# Built in AlmaLinux 8 (glibc 2.28, supported to 2029), so the binaries run on RHEL/Rocky/Alma 8,
# Debian 10, Ubuntu 20.04 and anything newer. A runner's own Ubuntu would tie them to its glibc,
# which is newer than most servers'. Debian 11 was the first choice and its mirrors no longer
# serve it.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    paths: ['.github/workflows/release.yml']

permissions:
  contents: write

jobs:
  console:
    name: web console bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vectordb/dashboard/package-lock.json
      - name: Build the console
        run: npm ci && npm run build
        working-directory: vectordb/dashboard
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: vectordb/dashboard/dist
          if-no-files-found: error

  linux:
    name: linux ${{ matrix.arch }}
    needs: console
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: almalinux:8
    defaults:
      run:
        working-directory: vectordb
        shell: bash
    steps:
      # Before checkout: in a container, actions/checkout needs git to make a real clone.
      - name: Build tools
        working-directory: /
        run: |
          dnf install -y gcc gcc-c++ make pkgconf-pkg-config git jq tar gzip which
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: vectordb/dashboard/dist
      # rustup reads vectordb/rust-toolchain.toml and installs the pinned version on first use.
      - name: Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build
        run: cargo build --release --locked --bin vectordb

      # The binary that is about to be shipped, started and used: it answers, it has the
      # console, and a table takes a write and a search.
      - name: Smoke test
        run: |
          bin=target/release/vectordb
          $bin --version
          HOME=$(mktemp -d) DXMT_EMBEDDING_AUTODETECT=0 $bin serve --port 9999 &
          server=$!
          for _ in $(seq 60); do curl -sf localhost:9999/health >/dev/null && break; sleep 1; done
          curl -sf localhost:9999/ready >/dev/null
          curl -sf -o /dev/null localhost:9999/dashboard
          h='content-type: application/json'
          curl -sf -X POST localhost:9999/api/v1/tables -H "$h" \
               -d '{"name":"smoke","dimension":3,"distance_metric":"cosine"}' >/dev/null
          curl -sf -X POST localhost:9999/api/v1/tables/smoke/records -H "$h" \
               -d '{"records":[{"id":"a","vector":[1,0,0]},{"id":"b","vector":[0,1,0]}]}' >/dev/null
          top=$(curl -sf -X POST localhost:9999/api/v1/tables/smoke/search -H "$h" \
               -d '{"vector":[1,0,0],"top_k":1}' | jq -r '.data.hits[0].id')
          test "$top" = a
          kill "$server"

      - name: Package
        id: package
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          name="dxmt-vectordb-${version}-${{ matrix.arch }}-linux-gnu"
          mkdir -p "dist/$name"
          cp target/release/vectordb LICENSE NOTICE README.md CHANGELOG.md .env.example "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: The tag names this version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME}" = "v${{ steps.package.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            vectordb/dist/*.tar.gz
            vectordb/dist/*.sha256
          if-no-files-found: error

  # Personal agents mostly run on Macs. Both architectures are built on an Apple-silicon
  # runner; the arm64 binary is smoke-tested there, the x86_64 one is cross-built (Intel
  # runners are being retired) and checked to be an x86_64 Mach-O.
  macos:
    name: macos ${{ matrix.arch }}
    needs: console
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    runs-on: macos-14
    defaults:
      run:
        working-directory: vectordb
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: vectordb/dashboard/dist
      - name: Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --locked --bin vectordb --target ${{ matrix.target }}
      - name: Smoke test
        run: |
          bin=target/${{ matrix.target }}/release/vectordb
          file "$bin"
          if [ "${{ matrix.arch }}" = x86_64 ]; then
            file "$bin" | grep -q 'x86_64'
            exit 0
          fi
          $bin --version
          HOME=$(mktemp -d) DXMT_EMBEDDING_AUTODETECT=0 $bin serve --port 9999 &
          server=$!
          for _ in $(seq 60); do curl -sf localhost:9999/health >/dev/null && break; sleep 1; done
          curl -sf localhost:9999/ready >/dev/null
          curl -sf -o /dev/null localhost:9999/dashboard
          h='content-type: application/json'
          curl -sf -X POST localhost:9999/api/v1/tables -H "$h" \
               -d '{"name":"smoke","dimension":3,"distance_metric":"cosine"}' >/dev/null
          curl -sf -X POST localhost:9999/api/v1/tables/smoke/records -H "$h" \
               -d '{"records":[{"id":"a","vector":[1,0,0]},{"id":"b","vector":[0,1,0]}]}' >/dev/null
          top=$(curl -sf -X POST localhost:9999/api/v1/tables/smoke/search -H "$h" \
               -d '{"vector":[1,0,0],"top_k":1}' | jq -r '.data.hits[0].id')
          test "$top" = a
          kill "$server"
      - name: Package
        id: package
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          name="dxmt-vectordb-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/vectordb LICENSE NOTICE README.md CHANGELOG.md .env.example "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            vectordb/dist/*.tar.gz
            vectordb/dist/*.sha256
          if-no-files-found: error

  # ghcr.io/dxmt/dxmt, linux/amd64 and linux/arm64, wrapping the two Linux binaries above
  # (docker/Dockerfile.release). A pull request builds the amd64 image and runs the smoke test
  # against the container; only a tag pushes.
  docker:
    name: container image
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: pkgs
          pattern: dxmt-vectordb-*-linux-gnu
          merge-multiple: true
      - name: Context
        id: ctx
        run: |
          for pair in x86_64:amd64 aarch64:arm64; do
            arch=${pair%%:*}; platform=${pair##*:}
            mkdir -p ctx/$platform
            tar -xzf pkgs/dxmt-vectordb-*-$arch-linux-gnu.tar.gz -C pkgs
            cp pkgs/dxmt-vectordb-*-$arch-linux-gnu/vectordb ctx/$platform/
          done
          echo "version=$(grep -m1 '^version' vectordb/Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: ctx
          file: vectordb/docker/Dockerfile.release
          platforms: linux/amd64
          build-args: VERSION=${{ steps.ctx.outputs.version }}
          load: true
          tags: dxmt-smoke
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 9999:9999 -e DXMT_EMBEDDING_AUTODETECT=0 dxmt-smoke
          for _ in $(seq 60); do curl -sf localhost:9999/health >/dev/null && break; sleep 1; done
          curl -sf localhost:9999/ready >/dev/null
          curl -sf -o /dev/null localhost:9999/dashboard
          h='content-type: application/json'
          curl -sf -X POST localhost:9999/api/v1/tables -H "$h" \
               -d '{"name":"smoke","dimension":3,"distance_metric":"cosine"}' >/dev/null
          curl -sf -X POST localhost:9999/api/v1/tables/smoke/records -H "$h" \
               -d '{"records":[{"id":"a","vector":[1,0,0]},{"id":"b","vector":[0,1,0]}]}' >/dev/null
          # A restart keeps the data: it lives in the volume, not in the container's layer.
          docker restart smoke
          for _ in $(seq 60); do curl -sf localhost:9999/health >/dev/null && break; sleep 1; done
          top=$(curl -sf -X POST localhost:9999/api/v1/tables/smoke/search -H "$h" \
               -d '{"vector":[1,0,0],"top_k":1}' | jq -r '.data.hits[0].id')
          test "$top" = a
          docker rm -f smoke
      # Docker Hub as well, once the repository has the two secrets; the repository is
      # DOCKERHUB_REPOSITORY (a variable), default <username>/dxmt.
      - name: Docker Hub target
        id: hub
        if: startsWith(github.ref, 'refs/tags/')
        env:
          USER: ${{ secrets.DOCKERHUB_USERNAME }}
          REPO: ${{ vars.DOCKERHUB_REPOSITORY }}
        run: |
          if [ -n "$USER" ]; then
            repo=${REPO:-$USER/dxmt}
            v=${{ steps.ctx.outputs.version }}
            { echo 'tags<<EOF'; echo "docker.io/$repo:$v"; echo "docker.io/$repo:latest"; echo EOF; } >> "$GITHUB_OUTPUT"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Log in to Docker Hub
        if: steps.hub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: ctx
          file: vectordb/docker/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.ctx.outputs.version }}
          push: true
          # An SBOM and a provenance attestation in the image index, readable with
          # `docker buildx imagetools inspect --format '{{ json .Provenance }}'`.
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/dxmt/dxmt:${{ steps.ctx.outputs.version }}
            ghcr.io/dxmt/dxmt:latest
            ${{ steps.hub.outputs.tags }}

  publish:
    name: attach to the release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos]
    runs-on: ubuntu-latest
    # id-token and attestations: a signed build-provenance attestation per archive, so anyone
    # can check a download came from this workflow (`gh attestation verify <file> -R dxmt/dxmt`).
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      # Only the packages: unfiltered, this also unpacked the console bundle, and its `assets/`
      # directory made `gh release upload assets/*` fail after three of the four files (1.4.0).
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: dxmt-vectordb-*
          merge-multiple: true
      - name: Build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: assets/*.tar.gz
      # The software bill of materials for the server: every crate in Cargo.lock, SPDX JSON,
      # attached to the release beside the archives.
      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          path: vectordb
          format: spdx-json
          output-file: assets/dxmt-vectordb-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # The CHANGELOG section for this version, as the draft's notes.
            awk -v v="${TAG#v}" '
              $0 ~ "^## \\[" v "\\]" { on = 1; next }
              on && /^## \[/ { exit }
              on { print }' vectordb/CHANGELOG.md > notes.md
            gh release create "$TAG" --draft --title "$TAG" --notes-file notes.md --verify-tag
          fi
          gh release upload "$TAG" assets/* --clobber
