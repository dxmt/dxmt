# Weekly dependency updates, one grouped pull request per ecosystem and directory, so a
# week's bumps arrive as a handful of PRs rather than dozens. Security updates are not
# grouped or delayed: GitHub opens those as soon as an advisory lands.
version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - "/vectordb"
      - "/vectordb/clients/dxmt-rust-sdk"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]
  - package-ecosystem: npm
    directories:
      - "/vectordb/clients/dxmt-js-sdk"
      - "/vectordb/clients/openclaw-memory-dxmt"
      - "/vectordb/dashboard"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]
  - package-ecosystem: pip
    directories:
      - "/vectordb/clients/dxmt-python-sdk"
      - "/vectordb/clients/langchain-dxmt"
      - "/vectordb/clients/llama-index-vector-stores-dxmt"
      - "/vectordb/clients/dxmt-haystack"
      - "/vectordb/clients/crewai-dxmt"
      - "/vectordb/clients/agent-framework-dxmt"
      - "/vectordb/clients/hermes-dxmt-memory"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      pip-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]
  - package-ecosystem: gomod
    directories:
      - "/vectordb/clients/dxmt-go-sdk"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      gomod-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]
  - package-ecosystem: github-actions
    directories:
      - "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]
